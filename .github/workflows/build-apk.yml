name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check project files (clear error if something was not uploaded to GitHub)
        run: |
          MISSING=0
          for f in native-assets/debug.keystore native-assets/fetch-azan-voices.js \
                   native-assets/android/MainActivity.java native-assets/android/AppUpdaterPlugin.java \
                   native-assets/android/UpdateFileProvider.java native-assets/android/update_file_paths.xml \
                   native-assets/android/sticky_card.xml native-assets/android/AzanReceiver.java \
                   native-assets/android/AzanService.java native-assets/android/UpdateJobService.java app/index.html app/js/app.js app/js/native-bridge.js; do
            if [ ! -f "$f" ]; then echo "ERROR: file is missing in the repository: $f"; MISSING=1; fi
          done
          if ! grep -q "Native azan player" .github/workflows/build-apk.yml; then echo "ERROR: build-apk.yml is an OLD version (no 'Native azan player' step)"; MISSING=1; fi
          [ "$MISSING" = "0" ] || exit 1
          echo "All required files are present."

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Azan voices (all voices from website dashboard, else native-assets/azan.mp3)
        run: |
          which ffmpeg >/dev/null 2>&1 || { sudo apt-get update -y && sudo apt-get install -y ffmpeg; }
          ffmpeg -version | head -n 1
          node native-assets/fetch-azan-voices.js
          cat app/js/native-config.js
          echo "--- azan sounds inside the APK (res/raw) ---"
          ls -la android/app/src/main/res/raw 2>/dev/null || echo "(no res/raw folder: NO azan sound is bundled)"

      - name: App version (for in-app update)
        run: |
          BASE=$(node -p "require('./package.json').version")
          # شمارهٔ بیلد به آخر نسخه اضافه می‌شود (مثلاً 1.1.2.15)؛ پس هر بیلد جدید حتماً «جدیدتر» شناخته می‌شود
          # و دیگر لازم نیست برای هر تغییر کوچک، version در package.json را دستی زیاد کنید.
          VER="$BASE.${{ github.run_number }}"
          echo "APP_VERSION=$VER" >> $GITHUB_ENV
          echo "window.NATIVE_APP_VERSION = '$VER';" >> app/js/native-config.js
          echo "App version: $VER"

      - name: Permissions in AndroidManifest
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />\n</manifest>#' "$M"
          cat "$M"

      - name: Native in-app updater (download and install APK inside the app)
        run: |
          MAIN=$(find android/app/src/main/java -name MainActivity.java | head -n 1)
          JDIR=$(dirname "$MAIN")
          echo "java dir: $JDIR"
          echo "$JDIR" | grep -q "com/arefanejam/quran" || { echo "ERROR: package folder is not com/arefanejam/quran"; exit 1; }
          cp native-assets/android/MainActivity.java native-assets/android/AppUpdaterPlugin.java native-assets/android/UpdateFileProvider.java "$JDIR/"
          mkdir -p android/app/src/main/res/xml
          cp native-assets/android/update_file_paths.xml android/app/src/main/res/xml/update_file_paths.xml
          mkdir -p android/app/src/main/res/layout
          cp native-assets/android/sticky_card.xml android/app/src/main/res/layout/sticky_card.xml
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n</manifest>#' "$M"
          sed -i 's#</application>#        <provider android:name="com.arefanejam.quran.UpdateFileProvider" android:authorities="${applicationId}.updateprovider" android:exported="false" android:grantUriPermissions="true">\n            <meta-data android:name="android.support.FILE_PROVIDER_PATHS" android:resource="@xml/update_file_paths" />\n        </provider>\n    </application>#' "$M"
          grep -q "updateprovider" "$M" || { echo "ERROR: provider was not added to manifest"; exit 1; }
          cat "$M"

      - name: Native azan player (plays azan offline, phone locked, app closed)
        run: |
          MAIN=$(find android/app/src/main/java -name MainActivity.java | head -n 1)
          JDIR=$(dirname "$MAIN")
          echo "$JDIR" | grep -q "com/arefanejam/quran" || { echo "ERROR: package folder is not com/arefanejam/quran"; exit 1; }
          cp native-assets/android/AzanReceiver.java native-assets/android/AzanService.java "$JDIR/"
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />\n</manifest>#' "$M"
          sed -i 's#</application>#        <receiver android:name="com.arefanejam.quran.AzanReceiver" android:exported="false">\n            <intent-filter>\n                <action android:name="android.intent.action.BOOT_COMPLETED" />\n                <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />\n                <action android:name="android.intent.action.TIME_SET" />\n                <action android:name="android.intent.action.TIMEZONE_CHANGED" />\n            </intent-filter>\n        </receiver>\n        <service android:name="com.arefanejam.quran.AzanService" android:exported="false" android:foregroundServiceType="mediaPlayback" />\n    </application>#' "$M"
          grep -q "AzanService" "$M" || { echo "ERROR: azan service was not added to manifest"; exit 1; }
          grep -q "AzanReceiver" "$M" || { echo "ERROR: azan receiver was not added to manifest"; exit 1; }
          cat "$M"

      - name: Native background update download (only online, even when the app is closed)
        run: |
          MAIN=$(find android/app/src/main/java -name MainActivity.java | head -n 1)
          JDIR=$(dirname "$MAIN")
          echo "$JDIR" | grep -q "com/arefanejam/quran" || { echo "ERROR: package folder is not com/arefanejam/quran"; exit 1; }
          cp native-assets/android/UpdateJobService.java "$JDIR/"
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n</manifest>#' "$M"
          sed -i 's#</application>#        <service android:name="com.arefanejam.quran.UpdateJobService" android:permission="android.permission.BIND_JOB_SERVICE" android:exported="false" />\n    </application>#' "$M"
          grep -q "UpdateJobService" "$M" || { echo "ERROR: update job service was not added to manifest"; exit 1; }
          cat "$M"

      - name: App icon and notification icon
        run: |
          sudo apt-get update -y
          sudo apt-get install -y imagemagick
          SRC=app/icons/icon-512.png
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          for d in "mdpi 48" "hdpi 72" "xhdpi 96" "xxhdpi 144" "xxxhdpi 192"; do
            set -- $d
            convert $SRC -resize ${2}x${2} $RES/mipmap-$1/ic_launcher.png
            convert $SRC -resize ${2}x${2} $RES/mipmap-$1/ic_launcher_round.png
            convert $SRC -resize ${2}x${2} $RES/mipmap-$1/ic_launcher_foreground.png
          done
          mkdir -p $RES/drawable
          convert -size 96x96 xc:none -fill white -draw "circle 44,48 44,12" \
            \( -size 96x96 xc:none -fill black -draw "circle 58,42 58,14" \) \
            -compose DstOut -composite $RES/drawable/ic_stat_azan.png

      - name: Sync web files into Android project
        run: npx cap sync android

      - name: Set Android versionCode and versionName
        run: |
          G=android/app/build.gradle
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/" "$G"
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"$APP_VERSION\"/" "$G"
          grep -n -E "versionCode|versionName" "$G"

      - name: Use fixed signing key (so updates install over the old app)
        run: |
          # کلید ثابت را هم در مسیر پیش‌فرض می‌گذاریم و هم مستقیماً در gradle مشخص می‌کنیم؛
          # تا هر بیلد حتماً با همین کلید امضا شود (وگرنه اندروید بروزرسانی را «تداخل با بستهٔ موجود» رد می‌کند)
          test -f native-assets/debug.keystore || { echo "ERROR: native-assets/debug.keystore not found"; exit 1; }
          mkdir -p ~/.android
          cp native-assets/debug.keystore ~/.android/debug.keystore
          python3 - <<'PY'
          import re
          p = 'android/app/build.gradle'
          s = open(p, encoding='utf-8').read()
          block = """android {
              signingConfigs {
                  debug {
                      storeFile rootProject.file('../native-assets/debug.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
          """
          assert re.search(r'^android \{\n', s, re.M), 'android block not found in build.gradle'
          s = re.sub(r'^android \{\n', lambda m: block, s, count=1, flags=re.M)
          open(p, 'w', encoding='utf-8').write(s)
          PY
          sed -n 1,20p android/app/build.gradle

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk arefanejam.apk

      - name: Verify APK signature (must match the fixed key)
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$APKSIGNER" ]; then echo "apksigner not found - skipping check"; exit 0; fi
          OUT=$("$APKSIGNER" verify --print-certs arefanejam.apk)
          echo "$OUT"
          echo "$OUT" | grep -q "SHA-256 digest: a3a5a47d8a0f880658ba60fee9fad7bba74acb87bd2430e29c860f093a4bb84a" || { echo "ERROR: APK is NOT signed with the fixed key"; exit 1; }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: arefanejam-apk
          path: arefanejam.apk

      - name: Publish GitHub Release (fixed download link for in-app update)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: عارفان جام ${{ env.APP_VERSION }}
          files: arefanejam.apk
          make_latest: true
