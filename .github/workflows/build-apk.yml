name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Azan sound (from website dashboard, else native-assets/azan.mp3)
        run: |
          API="https://arefanejam.com/wp-json/arefanejam/v1"
          RAW=android/app/src/main/res/raw
          mkdir -p $RAW
          FOUND=0
          URL=$(curl -fsSL --max-time 30 "$API/settings" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{try{console.log(JSON.parse(d).azan_audio_url||'')}catch(e){console.log('')}})" || true)
          echo "dashboard azan url: $URL"
          if [ -n "$URL" ]; then
            if curl -fsSL --max-time 180 -o /tmp/azan_src "$URL" && ffmpeg -y -loglevel error -i /tmp/azan_src -vn -ac 2 -b:a 128k $RAW/azan.mp3; then
              FOUND=1
              echo "azan sound taken from dashboard"
            else
              echo "could not download/convert dashboard azan"
              rm -f $RAW/azan.mp3
            fi
          fi
          if [ "$FOUND" = "0" ] && [ -f native-assets/azan.mp3 ]; then
            cp native-assets/azan.mp3 $RAW/azan.mp3
            FOUND=1
            echo "azan sound taken from native-assets/azan.mp3"
          fi
          if [ "$FOUND" = "1" ]; then
            echo "window.NATIVE_AZAN_SOUND = true;" > app/js/native-config.js
            echo "window.NATIVE_AZAN_SRC = '$URL';" >> app/js/native-config.js
          else
            echo "window.NATIVE_AZAN_SOUND = false;" > app/js/native-config.js
            echo "no azan sound found - default sound will be used"
          fi

      - name: App version (for in-app update)
        run: |
          BASE=$(node -p "require('./package.json').version")
          # شمارهٔ بیلد به آخر نسخه اضافه می‌شود (مثلاً 1.1.2.15)؛ پس هر بیلد جدید حتماً «جدیدتر» شناخته می‌شود
          # و دیگر لازم نیست برای هر تغییر کوچک، version در package.json را دستی زیاد کنید.
          VER="$BASE.${{ github.run_number }}"
          echo "APP_VERSION=$VER" >> $GITHUB_ENV
          echo "window.NATIVE_APP_VERSION = '$VER';" >> app/js/native-config.js
          echo "App version: $VER"

      - name: Permissions in AndroidManifest
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n</manifest>#' "$M"
          cat "$M"

      - name: App icon and notification icon
        run: |
          sudo apt-get update -y
          sudo apt-get install -y imagemagick
          SRC=app/icons/icon-512.png
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          for d in "mdpi 48" "hdpi 72" "xhdpi 96" "xxhdpi 144" "xxxhdpi 192"; do
            set -- $d
            convert $SRC -resize ${2}x${2} $RES/mipmap-$1/ic_launcher.png
            convert $SRC -resize ${2}x${2} $RES/mipmap-$1/ic_launcher_round.png
            convert $SRC -resize ${2}x${2} $RES/mipmap-$1/ic_launcher_foreground.png
          done
          mkdir -p $RES/drawable
          convert -size 96x96 xc:none -fill white -draw "circle 44,48 44,12" \
            \( -size 96x96 xc:none -fill black -draw "circle 58,42 58,14" \) \
            -compose DstOut -composite $RES/drawable/ic_stat_azan.png

      - name: Sync web files into Android project
        run: npx cap sync android

      - name: Set Android versionCode and versionName
        run: |
          G=android/app/build.gradle
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/" "$G"
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"$APP_VERSION\"/" "$G"
          grep -n -E "versionCode|versionName" "$G"

      - name: Use fixed signing key (so updates install over the old app)
        run: |
          mkdir -p ~/.android
          cp native-assets/debug.keystore ~/.android/debug.keystore

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk arefanejam.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: arefanejam-apk
          path: arefanejam.apk

      - name: Publish GitHub Release (fixed download link for in-app update)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: عارفان جام ${{ env.APP_VERSION }}
          files: arefanejam.apk
          make_latest: true
